services:
  - type: web
    name: arro-api
    runtime: docker
    # Temporary integration/staging host. Upgrade all three resources together
    # before real payment traffic; Render free services may sleep or reset.
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://api.atishghimire.com.np
      - key: APP_ALLOWED_ORIGINS
        value: https://atishghimire.com.np,https://www.atishghimire.com.np,http://localhost:8081,http://127.0.0.1:8081
      - key: DATABASE_URL
        fromDatabase:
          name: arro-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: arro-key-value
          property: connectionString
      - key: CATALOG_SEARCH_CACHE_TTL_MS
        value: "300000"
      - key: API_KEY_PEPPER
        generateValue: true
      - key: AGENT_SESSION_SIGNING_SECRET
        generateValue: true
      - key: ARRO_FRONTEND_SERVER_TOKEN
        generateValue: true
      - key: UCP_PLATFORM_SIGNING_PRIVATE_JWK_JSON
        sync: false
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: GOOGLE_PAY_ENABLED
        value: "false"
      - key: GOOGLE_PAY_ENVIRONMENT
        value: PRODUCTION
      - key: GOOGLE_PAY_WEB_ENABLED
        value: "false"
      - key: PROCESSOR_TOKENIZER_ENABLED
        value: "false"
      - key: AUTONOMOUS_PURCHASES_ENABLED
        value: "false"
      - key: AP2_RUNTIME_ENABLED
        value: "false"
      - key: EMBEDDED_CHECKOUT_RUNTIME_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_FAILURE_MODE
        value: closed
      - key: STARTUP_MIGRATION_VALIDATION
        value: "true"
      - key: SHUTDOWN_GRACE_PERIOD_MS
        value: "25000"

  - type: keyvalue
    name: arro-key-value
    plan: free
    region: singapore
    # This free instance is only cache/rate-limit state; evict popular-catalog
    # history instead of making new staging requests fail once 25 MB fills.
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: []

databases:
  - name: arro-postgres
    plan: free
    region: singapore
    databaseName: arro
    user: arro
    postgresMajorVersion: "17"
    ipAllowList: []
