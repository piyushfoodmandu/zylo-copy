volumes:
  postgres-data: {}
  redis-data: {}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arro
      POSTGRES_USER: arro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arro_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    stop_grace_period: 35s
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      PLATFORM_PROFILE_URL: ${PLATFORM_PROFILE_URL:-}
      ARRO_FRONTEND_SERVER_TOKEN: ${ARRO_FRONTEND_SERVER_TOKEN:-}
      UCP_PLATFORM_SIGNING_PRIVATE_JWK_JSON: ${UCP_PLATFORM_SIGNING_PRIVATE_JWK_JSON:-}
      UCP_PLATFORM_ADDITIONAL_PUBLIC_JWKS_JSON: ${UCP_PLATFORM_ADDITIONAL_PUBLIC_JWKS_JSON:-}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://arro:${POSTGRES_PASSWORD:-arro_dev_password}@postgres:5432/arro}
      REDIS_URL: ${API_REDIS_URL:-redis://redis:6379}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-local-development-api-key-pepper-change-for-shared-environments}
      AGENT_SESSION_SIGNING_SECRET: ${AGENT_SESSION_SIGNING_SECRET:-local-development-agent-session-signing-secret-change-for-shared-environments}
      AGENT_SESSION_MAX_TTL_SECONDS: ${AGENT_SESSION_MAX_TTL_SECONDS:-1800}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}
      POSTGRES_POOL_IDLE_TIMEOUT_MS: ${POSTGRES_POOL_IDLE_TIMEOUT_MS:-30000}
      POSTGRES_STATEMENT_TIMEOUT_MS: ${POSTGRES_STATEMENT_TIMEOUT_MS:-30000}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      CONNECTOR_TIMEOUT_MS: ${CONNECTOR_TIMEOUT_MS:-10000}
      CATALOG_HTTP_MAX_CONNECTIONS_PER_ORIGIN: ${CATALOG_HTTP_MAX_CONNECTIONS_PER_ORIGIN:-64}
      CATALOG_CONNECTOR_MAX_SOURCES_PER_REQUEST: ${CATALOG_CONNECTOR_MAX_SOURCES_PER_REQUEST:-5}
      CATALOG_CONNECTOR_MAX_CONCURRENCY_PER_REQUEST: ${CATALOG_CONNECTOR_MAX_CONCURRENCY_PER_REQUEST:-3}
      CATALOG_CONNECTOR_COALESCING_WINDOW_MS: ${CATALOG_CONNECTOR_COALESCING_WINDOW_MS:-100}
      CONNECTOR_DNS_CACHE_ENABLED: ${CONNECTOR_DNS_CACHE_ENABLED:-true}
      CONNECTOR_DNS_CACHE_TTL_MS: ${CONNECTOR_DNS_CACHE_TTL_MS:-30000}
      CONNECTOR_DNS_CACHE_MAX_ENTRIES: ${CONNECTOR_DNS_CACHE_MAX_ENTRIES:-512}
      TARGET_BUSINESS_MATRIX_CACHE_TTL_MS: ${TARGET_BUSINESS_MATRIX_CACHE_TTL_MS:-5000}
      CATALOG_PRODUCT_DETAIL_CACHE_TTL_MS: ${CATALOG_PRODUCT_DETAIL_CACHE_TTL_MS:-60000}
      CATALOG_SEARCH_CACHE_TTL_MS: ${CATALOG_SEARCH_CACHE_TTL_MS:-300000}
      SHUTDOWN_GRACE_PERIOD_MS: ${SHUTDOWN_GRACE_PERIOD_MS:-25000}
      STARTUP_MIGRATION_VALIDATION: ${STARTUP_MIGRATION_VALIDATION:-true}
      REQUEST_AUDIT_LOG_RETENTION_DAYS: ${REQUEST_AUDIT_LOG_RETENTION_DAYS:-90}
      SEARCH_AUDIT_LOG_RETENTION_DAYS: ${SEARCH_AUDIT_LOG_RETENTION_DAYS:-30}
      PURCHASE_SESSION_RETENTION_DAYS: ${PURCHASE_SESSION_RETENTION_DAYS:-30}
      DISCOVERY_OBSERVATION_RETENTION_DAYS: ${DISCOVERY_OBSERVATION_RETENTION_DAYS:-180}
      CONFORMANCE_MAX_AGE_DAYS: ${CONFORMANCE_MAX_AGE_DAYS:-30}
      CONFORMANCE_FIXTURE_MODE: ${CONFORMANCE_FIXTURE_MODE:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_FAILURE_MODE: ${RATE_LIMIT_FAILURE_MODE:-closed}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_UCP_DISCOVERY_MAX: ${RATE_LIMIT_UCP_DISCOVERY_MAX:-10}
      RATE_LIMIT_AGENT_SESSION_MAX: ${RATE_LIMIT_AGENT_SESSION_MAX:-20}
      PLATFORM_PROFILE_MAX_AGE_SECONDS: ${PLATFORM_PROFILE_MAX_AGE_SECONDS:-300}
      DEPENDENCY_CHECK_TIMEOUT_MS: ${DEPENDENCY_CHECK_TIMEOUT_MS:-1500}
      CATALOG_ADAPTERS_JSON: ${CATALOG_ADAPTERS_JSON:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      PAYMENT_CREDENTIAL_ENCRYPTION_KEY: ${PAYMENT_CREDENTIAL_ENCRYPTION_KEY:-}
      PAYMENT_ACTION_SIGNING_SECRET: ${PAYMENT_ACTION_SIGNING_SECRET:-}
      PAYMENT_CREDENTIAL_TTL_SECONDS: ${PAYMENT_CREDENTIAL_TTL_SECONDS:-900}
      HOST_PAYMENT_CAPABILITIES_JSON: ${HOST_PAYMENT_CAPABILITIES_JSON:-}
      HOST_PAYMENT_ATTESTATION_KEYS_JSON: ${HOST_PAYMENT_ATTESTATION_KEYS_JSON:-}
      AUTONOMOUS_PURCHASES_ENABLED: ${AUTONOMOUS_PURCHASES_ENABLED:-false}
      PRIMARY_AUTONOMOUS_ROUTE: ${PRIMARY_AUTONOMOUS_ROUTE:-}
      PROCESSOR_TOKENIZER_ENABLED: ${PROCESSOR_TOKENIZER_ENABLED:-false}
      UCP_PAYMENT_HANDLER_SPECS_JSON: ${UCP_PAYMENT_HANDLER_SPECS_JSON:-}
      UCP_TOKENIZER_AUTH_JSON: ${UCP_TOKENIZER_AUTH_JSON:-}
      UCP_MERCHANT_AUTH_JSON: ${UCP_MERCHANT_AUTH_JSON:-}
      SHOPIFY_AGENT_CLIENT_ID: ${SHOPIFY_AGENT_CLIENT_ID:-}
      SHOPIFY_AGENT_CLIENT_SECRET: ${SHOPIFY_AGENT_CLIENT_SECRET:-}
      GOOGLE_PAY_ENABLED: ${GOOGLE_PAY_ENABLED:-false}
      GOOGLE_PAY_ENVIRONMENT: ${GOOGLE_PAY_ENVIRONMENT:-PRODUCTION}
      GOOGLE_PAY_WEB_ENABLED: ${GOOGLE_PAY_WEB_ENABLED:-false}
      GOOGLE_PAY_WEB_ALLOWED_ORIGINS: ${GOOGLE_PAY_WEB_ALLOWED_ORIGINS:-}
      GOOGLE_PAY_PRODUCTION_MERCHANT_ID: ${GOOGLE_PAY_PRODUCTION_MERCHANT_ID:-}
      GOOGLE_PAY_PRODUCTION_HANDLER_ID: ${GOOGLE_PAY_PRODUCTION_HANDLER_ID:-}
      GOOGLE_PAY_PRODUCTION_PSP: ${GOOGLE_PAY_PRODUCTION_PSP:-}
      GOOGLE_PAY_PRODUCTION_APPROVAL_REFERENCE: ${GOOGLE_PAY_PRODUCTION_APPROVAL_REFERENCE:-}
      GOOGLE_PAY_WEB_PRODUCTION_REGISTERED_ORIGIN: ${GOOGLE_PAY_WEB_PRODUCTION_REGISTERED_ORIGIN:-}
      AP2_RUNTIME_ENABLED: ${AP2_RUNTIME_ENABLED:-false}
      AP2_TRUSTED_ISSUERS_JSON: ${AP2_TRUSTED_ISSUERS_JSON:-}
      EMBEDDED_CHECKOUT_RUNTIME_ENABLED: ${EMBEDDED_CHECKOUT_RUNTIME_ENABLED:-false}
      UCP_CHECKER_REGISTRY_URL: ${UCP_CHECKER_REGISTRY_URL:-}
      SHOPPER_GOOGLE_CLIENT_IDS: ${SHOPPER_GOOGLE_CLIENT_IDS:-}
      SHOPPER_APPLE_CLIENT_IDS: ${SHOPPER_APPLE_CLIENT_IDS:-}
      MERCHANT_UCP_CATALOG_TOKEN: ${MERCHANT_UCP_CATALOG_TOKEN:-}
      MERCHANT_UCP_MCP_TOKEN: ${MERCHANT_UCP_MCP_TOKEN:-}
      MERCHANT_SHOPIFY_STOREFRONT_TOKEN: ${MERCHANT_SHOPIFY_STOREFRONT_TOKEN:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/health/ready'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
